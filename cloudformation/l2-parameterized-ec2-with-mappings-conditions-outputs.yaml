AWSTemplateFormatVersion: '2010-09-09'
Description: L2 - Parameterized EC2 with instance type mappings, environment conditions, and SSM outputs

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Deployment environment

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch instance into

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet to launch instance into

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI, resolved from the public SSM parameter at deploy time (no hard-coded AMI IDs)

  EnableMonitoring:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable detailed CloudWatch monitoring

Mappings:
  EnvironmentInstanceTypeMap:
    dev:
      InstanceType: t3.micro
      VolumeSize: 20
    staging:
      InstanceType: t3.small
      VolumeSize: 40
    prod:
      InstanceType: t3.medium
      VolumeSize: 80


Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsNotProd: !Not [!Equals [!Ref Environment, prod]]
  IsMonitoringEnabled: !Equals [!Ref EnableMonitoring, 'true']
  CreateElasticIP: !Or
    - !Equals [!Ref Environment, staging]
    - !Equals [!Ref Environment, prod]

Resources:
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${Environment} EC2 instance'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
          Description: SSH from internal networks only
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Open to the world only outside prod, so it is its own conditional resource
  AppPortIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsNotProd
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: 0.0.0.0/0
      Description: App port from anywhere (dev and staging only)

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !If
          - IsProd
          - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          - !Ref AWS::NoValue

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !FindInMap [EnvironmentInstanceTypeMap, !Ref Environment, InstanceType]
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Monitoring: !If [IsMonitoringEnabled, true, false]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !FindInMap [EnvironmentInstanceTypeMap, !Ref Environment, VolumeSize]
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y amazon-cloudwatch-agent
          echo "Environment: ${Environment}" > /etc/instance-env
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ec2-instance'
        - Key: Environment
          Value: !Ref Environment

  ElasticIP:
    Type: AWS::EC2::EIP
    Condition: CreateElasticIP
    Properties:
      Domain: vpc
      InstanceId: !Ref EC2Instance

  CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub '${Environment}-ec2-high-cpu'
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  InstancePrivateIP:
    Description: Private IP of the instance
    Value: !GetAtt EC2Instance.PrivateIp

  ElasticIPAddress:
    Description: Elastic IP address (staging/prod only)
    Condition: CreateElasticIP
    Value: !Ref ElasticIP
    Export:
      Name: !Sub '${AWS::StackName}-ElasticIP'

  InstanceType:
    Description: Resolved instance type for this environment
    Value: !FindInMap [EnvironmentInstanceTypeMap, !Ref Environment, InstanceType]
