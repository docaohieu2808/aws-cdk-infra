AWSTemplateFormatVersion: '2010-09-09'
Description: >
  L3 Child - EC2 webserver with userdata, IAM instance profile, and security group.
  Receives VpcId and PublicSubnetId from the VPC child stack via root !GetAtt.
  Output SecurityGroupId is consumed by the RDS child stack.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID passed from the VPC child stack

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet to place the webserver in

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

Mappings:
  InstanceTypeMap:
    dev:
      InstanceType: t3.micro
      VolumeSize: 20
    staging:
      InstanceType: t3.small
      VolumeSize: 40
    prod:
      InstanceType: t3.medium
      VolumeSize: 80

  # Note: AMI IDs below are Amazon Linux 2023 (us-east-1 / us-west-2 / eu-west-1 / ap-southeast-1).
  # For production use, resolve dynamically via SSM:
  #   !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
  RegionAMIMap:
    us-east-1:
      AMI: ami-0c02fb55956c7d316
    us-west-2:
      AMI: ami-0892d3c7ee96c0bf7
    eu-west-1:
      AMI: ami-08ca3fed11864d6bb
    ap-southeast-1:
      AMI: ami-0d058fe428540cd89

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Webserver SG — ${Environment}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
          Description: HTTP from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: '10.0.0.0/8'
          Description: SSH from internal only
      Tags:
        - Key: Environment
          Value: !Ref Environment

  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !If
          - IsProd
          - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebServerRole

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionAMIMap, !Ref 'AWS::Region', AMI]
      InstanceType: !FindInMap [InstanceTypeMap, !Ref Environment, InstanceType]
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      IamInstanceProfile: !Ref WebServerInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !FindInMap [InstanceTypeMap, !Ref Environment, VolumeSize]
            VolumeType: gp3
            Encrypted: !If [IsProd, true, false]
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          yum update -y
          yum install -y httpd
          systemctl enable httpd
          systemctl start httpd
          echo "<h1>Hello from ${Environment} webserver ($(hostname))</h1>" > /var/www/html/index.html
          echo "Environment: ${Environment}" > /etc/instance-env
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-webserver'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  InstanceId:
    Description: EC2 instance ID — returned to root stack
    Value: !Ref WebServerInstance

  SecurityGroupId:
    Description: Webserver SG ID — consumed by RDS child stack for DB ingress rule
    Value: !Ref WebServerSecurityGroup

  PublicIp:
    Description: Public IP of the webserver
    Value: !GetAtt WebServerInstance.PublicIp
