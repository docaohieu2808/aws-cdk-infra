version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
    # @types/node follows the Node major the project runs on (24 LTS); a new major is a runtime decision.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
